<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>현준 사회 2단원 퀴즈</title>
<meta name="theme-color" content="#2c5fb8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 한 화면 학습 앱 — 상단 컨트롤 바, 가운데 한 장의 카드, 하단 판정 버튼 */
:root{
  --bg:#f3f5f9; --paper:#ffffff; --fg:#1d2433; --muted:#5d6675; --line:#d9dee8;
  --accent:#2c5fb8; --accent-fg:#ffffff; --soft:#e4ecf9;
  --ok:#1f8a5b; --ok-soft:#dff3e8; --no:#c23b3b; --no-soft:#fbe3e3;
  --r1:#d85a30; --r1s:#faece7; --r2:#ba7517; --r2s:#faeeda; --r3:#1d9e75; --r3s:#e1f5ee; --r4:#7f77dd; --r4s:#eeedfe; --r5:#d4537e; --r5s:#fbeaf0;
  --display:"Gowun Dodum","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141922; --paper:#1e2531; --fg:#e8ecf3; --muted:#9aa5b8; --line:#333c4c;
  --accent:#6f9ce8; --accent-fg:#0f1623; --soft:#243352;
  --ok:#5fcf97; --ok-soft:#1d3a2c; --no:#ef7b7b; --no-soft:#432222;
  --r1:#f0997b; --r1s:#3d2217; --r2:#efb15a; --r2s:#3a2a10; --r3:#5dcaa5; --r3s:#133229; --r4:#afa9ec; --r4s:#262346; --r5:#ed93b1; --r5s:#3f1c2a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141922; --paper:#1e2531; --fg:#e8ecf3; --muted:#9aa5b8; --line:#333c4c;
  --accent:#6f9ce8; --accent-fg:#0f1623; --soft:#243352;
  --ok:#5fcf97; --ok-soft:#1d3a2c; --no:#ef7b7b; --no-soft:#432222;
  --r1:#f0997b; --r1s:#3d2217; --r2:#efb15a; --r2s:#3a2a10; --r3:#5dcaa5; --r3s:#133229; --r4:#afa9ec; --r4s:#262346; --r5:#ed93b1; --r5s:#3f1c2a;
  color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
h1{font-family:var(--display);font-size:1.25rem;margin:0;font-weight:400;letter-spacing:-.01em;text-wrap:balance}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper);margin-left:auto}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.9rem;padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--muted);font:inherit;font-size:.85rem;padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--soft);font-weight:500}
.chip.r1[aria-pressed="true"]{border-color:var(--r1);color:var(--r1);background:var(--r1s)}
.chip.r2[aria-pressed="true"]{border-color:var(--r2);color:var(--r2);background:var(--r2s)}
.chip.r3[aria-pressed="true"]{border-color:var(--r3);color:var(--r3);background:var(--r3s)}
.chip.r4[aria-pressed="true"]{border-color:var(--r4);color:var(--r4);background:var(--r4s)}
.chip.r5[aria-pressed="true"]{border-color:var(--r5);color:var(--r5);background:var(--r5s)}
.status{display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.wrong{color:var(--no);font-weight:500}
.card{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px;overflow:auto}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.tag b{display:inline-block;padding:2px 8px;border-radius:6px;font-weight:600;letter-spacing:0}
.tag b.r1{color:var(--r1);background:var(--r1s)} .tag b.r2{color:var(--r2);background:var(--r2s)} .tag b.r3{color:var(--r3);background:var(--r3s)} .tag b.r4{color:var(--r4);background:var(--r4s)} .tag b.r5{color:var(--r5);background:var(--r5s)}
.q{font-family:var(--display);font-size:1.45rem;line-height:1.45;margin:14px 0 0;text-wrap:balance}
.q .blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--accent);color:var(--accent);text-align:center;font-family:var(--body);font-size:.9em;padding:0 .3em}
.qtitle{font-size:1.05rem;color:var(--muted);margin:14px 0 0;font-weight:500}
.q.ans{margin-top:8px;font-size:1.3rem}
.gl{border-bottom:1.5px dotted var(--accent);cursor:pointer}
.glossbox{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:.95rem;line-height:1.5}
.glossbox b{color:var(--accent)}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.choices .lbl{font-size:.85rem;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cbtn{font:inherit;font-size:1rem;padding:12px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;text-align:center}
.cbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:500}
.cbtn.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)} .cbtn.no{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.cbtn:disabled{cursor:default}
.hintbox{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--soft);font-size:1rem;line-height:1.55}
.hintbox .lbl{color:var(--accent);display:block;margin-bottom:4px}
.q .blank.ok{color:var(--ok);border-color:var(--ok)} .q .blank.no{color:var(--no);border-color:var(--no);text-decoration:line-through}
.inputs{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.inputs label{font-size:.85rem;color:var(--muted)}
.inputs input{font:inherit;font-size:1.1rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);width:100%}
.inputs input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.answer{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:12px}
.answer .lbl{font-size:.78rem;letter-spacing:.04em;color:var(--muted)}
.answer .book{font-size:1.15rem;font-weight:500;line-height:1.5}
.answer .easy{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:1rem;line-height:1.55}
.answer .easy .lbl{color:var(--accent);margin-bottom:4px;display:block}
.verdict{font-weight:600;font-size:1rem}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
.spacer{flex:1}
.hint{margin-top:auto;padding-top:12px;font-size:.8rem;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:8px}
.nav button{font:inherit;font-size:.9rem;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions.one{grid-template-columns:1fr}
.btn{font:inherit;font-size:1.05rem;font-weight:500;padding:16px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--fg);cursor:pointer}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.btn.no{background:var(--no-soft);color:var(--no);border-color:var(--no)}
.btn.ghost{color:var(--muted)}
.done{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.done h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:6px 0 0}
.done .big{font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.done p{margin:0;color:var(--muted)}
.wronglist{margin:8px 0 0;padding-left:1.2em;font-size:.95rem;line-height:1.6}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small{font-size:.85rem;color:var(--muted)}
@media (max-width:480px){.q{font-size:1.25rem}.cgrid{grid-template-columns:1fr 1fr}.card{padding:16px}.btn{padding:14px;font-size:1rem}.seg{margin-left:0}}
</style>

<div class="app">
  <header>
    <h1>사회 2단원 · 시장경제와 국가 간 거래</h1>
    <div class="seg" role="group" aria-label="문제 방식">
      <button type="button" id="modeQa" aria-pressed="true">답 빈칸</button>
      <button type="button" id="modeBl" aria-pressed="false">문장 괄호</button>
    </div>
    <div class="seg" role="group" aria-label="답하는 방법" style="margin-left:0">
      <button type="button" id="ansPick" aria-pressed="true">고르기</button>
      <button type="button" id="ansType" aria-pressed="false">쓰기</button>
    </div>
  </header>
  <div class="chips" id="chips" role="group" aria-label="회차 선택">
    <button type="button" class="chip" data-r="all" aria-pressed="true">전체</button>
    <button type="button" class="chip r1" data-r="1회">1회 시장경제</button>
    <button type="button" class="chip r2" data-r="2회">2회 가계·기업</button>
    <button type="button" class="chip r3" data-r="3회">3회 근로자·기업</button>
    <button type="button" class="chip r4" data-r="4회">4회 경제성장</button>
    <button type="button" class="chip r5" data-r="5회">5회 성장의 문제</button>
    <button type="button" class="chip" id="chipWrong" data-r="wrong" aria-pressed="false">틀린 것만</button>
  </div>
  <div class="status">
    <span id="count">0 / 0</span>
    <div class="bar"><i id="barFill"></i></div>
    <span id="wrongCount" class="wrong"></span>
  </div>
  <section class="card" id="card" aria-live="polite"></section>
  <div class="nav" id="nav"><button type="button" id="btnPrev">← 이전</button><button type="button" id="btnNext">건너뛰기 →</button></div>
  <div class="actions" id="actions"></div>
</div>

function cardsFor(m){ return (m==='qa'? DATA.qa : DATA.bl).map((c,i)=>Object.assign({id:m+i}, c)); }

function norm(s){ return (s||'').replace(/\s+/g,'').replace(/[ㆍ・]/g,'·').replace(/[%％]/g,'%').trim(); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function glossify(text){
  let out = esc(text);
  GLOSS_KEYS.forEach(k=>{ const ek = esc(k); if(out.includes(ek)) out = out.replace(ek, `<span class="gl" data-g="${ek}">${ek}</span>`); });
  return out;
}
function buildDeck(){
  let all = cardsFor(mode);
  if(filter==='wrong') all = all.filter(c=>wrongSet.has(c.id));

function makeChoices(c){
  if(c._choices) return c._choices;
  const pool = cardsFor(mode).filter(o=>o.id!==c.id).flatMap(o=>o.a);
  const same = cardsFor(mode).filter(o=>o.id!==c.id && o.r===c.r).flatMap(o=>o.a);
  c._choices = c.a.map(ans=>{
    const bad = new Set(c.a.map(norm));
    const pick = (src)=> shuffle(src.filter(w=>!bad.has(norm(w)) && Math.abs(w.length-ans.length)<=4));
    let ds = []; const seen = new Set();
    for(const w of [...pick(same), ...pick(pool)]){ if(ds.length>=3) break; if(seen.has(norm(w))) continue; seen.add(norm(w)); ds.push(w); }
    return shuffle([ans, ...ds]);
  });
  return c._choices;
}

  }
}
function check(c){
  c._typed = ansWay==='type' ? c.a.map((_,i)=> ($('in'+i)||{}).value || '') : (c._sel||[]).map(x=>x||'');
  c._v = c._typed.every((t,i)=> norm(t)===norm(c.a[i]));
  if(!c._v || hintOn) markWrong(c);
  c._rev = true; render();
}
function markWrong(c){ if(!sessionWrong.includes(c)) sessionWrong.push(c); wrongSet.add(c.id); store.set('wrong_'+mode, [...wrongSet]); }
function grade(ok){
  const c = deck[idx];
  if(ok){ if(!sessionWrong.includes(c)){ wrongSet.delete(c.id); store.set('wrong_'+mode, [...wrongSet]); } }
  else markWrong(c);
  c._graded = ok;
  goNext();
}
function goNext(){ hintOn = false; glossWord = null; idx++; if(idx>=deck.length) finished = true; render(); window.scrollTo(0,0); }
function goPrev(){ if(idx===0) return; hintOn = false; glossWord = null; if(finished){ finished = false; idx = deck.length-1; } else idx--; render(); window.scrollTo(0,0); }
$('btnNext').onclick = goNext;
$('btnPrev').onclick = goPrev;
function renderDone(){
  const total = deck.length, right = total - sessionWrong.length;
  const card = $('card'), act = $('actions');
  const list = sessionWrong.length
    ? `<p>다시 볼 문제</p><ol class="wronglist">${sessionWrong.map(c=> `<li>${esc(c.q || c.t.replace(/___/g,'(　　)'))} <span class="small">— ${esc(c.full || c.a.join(', '))}</span></li>`).join('')}</ol>`
    : `<p>전부 맞혔어요. 이 묶음은 끝!</p>`;
  card.innerHTML = `<div class="done"><h2>한 바퀴 끝</h2><div class="big">${right} / ${total}</div>${list}</div>`;
  act.className='actions';
  act.innerHTML = (sessionWrong.length? `<button type="button" class="btn primary" id="btnRedo">틀린 것만 다시 (${sessionWrong.length})</button>` : `<button type="button" class="btn primary" id="btnAgain">한 바퀴 더</button>`) + `<button type="button" class="btn" id="btnNew">다른 회차 고르기</button>`;
  const redo = $('btnRedo'); if(redo) redo.onclick = ()=>{ filter='wrong'; store.set('filter',filter); buildDeck(); };
  const again = $('btnAgain'); if(again) again.onclick = buildDeck;
  $('btnNew').onclick = ()=>{ filter='all'; store.set('filter',filter); buildDeck(); };
}
function setMode(m){ if(mode===m) return; mode=m; store.set('mode',mode); wrongSet = new Set(store.get('wrong_'+mode, [])); if(filter==='wrong'&&!wrongSet.size){ filter='all'; store.set('filter',filter); } buildDeck(); }
$('modeQa').onclick = ()=>setMode('qa');
$('modeBl').onclick = ()=>setMode('bl');
$('ansPick').onclick = ()=>{ if(ansWay!=='pick'){ ansWay='pick'; store.set('ans',ansWay); render(); } };
$('ansType').onclick = ()=>{ if(ansWay!=='type'){ ansWay='type'; store.set('ans',ansWay); render(); } };
document.querySelectorAll('#chips .chip').forEach(b=> b.onclick = ()=>{ filter = b.dataset.r; store.set('filter',filter); buildDeck(); });
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key===' '||e.key==='Enter'){ const o=$('btnOk'); if(o && !$('btnNo')){ e.preventDefault(); o.click(); } }
  if(e.key==='ArrowLeft'){ goPrev(); }
  if(e.key==='ArrowRight'){ if(!finished && deck.length) goNext(); }
  if(e.key==='1'){ const n=$('btnNo'); if(n) n.click(); }
  if(e.key==='2'){ const o=$('btnOk'); if(o) o.click(); }
});
if(filter==='wrong' && !wrongSet.size) filter='all';
buildDeck();
</script>
</body>
</html>
