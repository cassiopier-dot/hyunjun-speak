<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C7466">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.install{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--surface);border:2px solid var(--teal);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 6px 20px rgba(0,0,0,.15);z-index:20}
.install p{font-size:.95rem}
.xlink{font-size:.9rem;text-align:center}
.xlink a{color:var(--teal);font-weight:700}
</style>
<title>현준이 친구 기술 연습장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 12칸 퀘스트 지도(홈) → 회기 화면(규칙·퀴즈·역할극·미션 탭). 태블릿·폰 한 손 조작 기준 */
:root{
  --bg:#EDF2EF; --surface:#FFFFFF; --ink:#16302B; --muted:#5B726C; --line:#D3DEDA;
  --teal:#1C7466; --teal-soft:#D6ECE7; --gold:#D9970F; --gold-soft:#FBEFD2;
  --good:#2E8B57; --good-soft:#DDF1E4; --bad:#C0453A; --bad-soft:#F8DEDB;
  --display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1B19; --surface:#172725; --ink:#E4EEEA; --muted:#93AAA4; --line:#2A3E3A;
  --teal:#4DBBA8; --teal-soft:#1D3833; --gold:#F0B437; --gold-soft:#3A2F14;
  --good:#5FC98B; --good-soft:#1C3527; --bad:#EC7B70; --bad-soft:#3E2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1B19; --surface:#172725; --ink:#E4EEEA; --muted:#93AAA4; --line:#2A3E3A;
  --teal:#4DBBA8; --teal-soft:#1D3833; --gold:#F0B437; --gold-soft:#3A2F14;
  --good:#5FC98B; --good-soft:#1C3527; --bad:#EC7B70; --bad-soft:#3E2220; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:2rem} h2{font-size:1.6rem} h3{font-size:1.2rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted)}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.score{font-family:var(--display);font-size:1.1rem;background:var(--gold-soft);color:var(--ink);padding:6px 14px;border-radius:999px;font-variant-numeric:tabular-nums}
.guide{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.guide b{color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:120px;transition:transform .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--teal)}
.tile .no{font-family:var(--display);color:var(--teal);font-size:1rem}
.tile .t{font-family:var(--display);font-size:1.15rem;line-height:1.3}
.stars{margin-top:auto;display:flex;gap:4px}
.stars i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.stars i.on{background:var(--gold)}
.tile.done{border-color:var(--gold);background:linear-gradient(var(--surface),var(--surface)) padding-box}
.back{background:none;border:none;color:var(--teal);font-weight:700;padding:0;align-self:flex-start}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tabs button{background:none;border:none;padding:10px 14px;font-family:var(--display);font-size:1.05rem;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--teal);border-color:var(--teal)}
.tabs button .ok{color:var(--gold)}
.panel{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.goal{background:var(--teal-soft);border-radius:12px;padding:12px 16px}
.rules{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.rules li::marker{color:var(--teal);font-weight:700}
.say{font-family:var(--display);font-size:1.25rem;color:var(--teal)}
.tag{display:inline-block;font-size:.78rem;letter-spacing:.04em;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--gold-soft);color:var(--ink);align-self:flex-start}
.sit{font-size:1.1rem;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left}
.opt:hover:not([disabled]){border-color:var(--teal)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.why{border-left:4px solid var(--good);padding:8px 12px;background:var(--good-soft);border-radius:0 10px 10px 0}
.why.no{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--teal);color:var(--surface);border:none;border-radius:999px;padding:10px 20px;font-weight:700}
.btn.ghost{background:none;color:var(--teal);border:2px solid var(--teal)}
.line{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:start}
.who{font-family:var(--display);font-size:.95rem;text-align:center;padding:4px 6px;border-radius:8px}
.who.dad{background:var(--gold-soft)} .who.me{background:var(--teal-soft);color:var(--ink)}
.line .txt{min-width:0}
.hint{font-size:.92rem;color:var(--muted)}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:none}
.check input{width:24px;height:24px;accent-color:var(--teal);flex:none;margin-top:3px}
.check label{cursor:pointer}
.parent{background:var(--gold-soft);border-radius:12px;padding:12px 16px;font-size:.95rem}
.prog{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--gold);transition:width .3s}
.lvl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lvl button{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;display:flex;flex-direction:column}
.lvl button b{font-family:var(--display);font-weight:400;font-size:1.15rem}
.lvl button span{font-size:.85rem;color:var(--muted)}
.lvl button[aria-selected="true"]{border-color:var(--teal);background:var(--teal-soft)}
.tile.lock{opacity:.55}
.tile.lock:hover{transform:none;border-color:var(--line)}
.lvtag{font-family:var(--display);color:var(--teal)}
.subtag{background:var(--teal-soft)}
.opt.meh{background:var(--gold-soft);border-color:var(--gold)}
.why.meh{border-color:var(--gold);background:var(--gold-soft)}
.ask{border:2px dashed var(--teal);border-radius:12px;padding:10px 14px;margin-top:10px}
.ask b{color:var(--teal)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:440px){h1{font-size:1.6rem}.line{grid-template-columns:58px 1fr}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const S = [
 {t:"대화 기술", sub:"정보 주고받기", goal:"묻고, 답하고, 내 얘기도 하면서 친구와 공통 관심사를 찾아요.",
  rules:["친구에게 질문하고, 대답을 잘 듣고, 내 얘기도 해요. (주고받기)","친구가 물어보면 대답한 뒤 \"너는?\" 하고 되물어요.","공통 관심사를 찾으면 그 얘기를 이어가요.","혼자 길게 말하지 않아요. 한 번에 2~3문장!","처음 대화에서 너무 사적인 질문은 하지 않아요."],
  key:"나는 ~했어. 너는?",
  quiz:[
   {s:"친구가 \"주말에 뭐 했어?\"라고 물었어.",o:["좋아하는 게임 얘기를 5분 동안 혼자 한다","\"야구 보러 갔어. 너는?\" 하고 되묻는다","\"몰라\" 하고 대답 안 한다","\"왜 물어봐?\" 한다"],a:1,w:"대답하고 \"너는?\"으로 공을 다시 넘기면 대화가 이어져요."},
   {s:"친구가 \"나 요즘 마인크래프트 해\"라고 했어. 나도 해!",o:["\"아 그래\" 하고 다른 얘기를 한다","\"나도 해! 뭐 만들고 있어?\" 하고 묻는다","\"그거 유치해\" 한다","대답 없이 고개만 끄덕인다"],a:1,w:"공통 관심사를 찾았어요! 질문을 하나 더 하면 대화가 길어져요."}],
  role:[["dad","현준아, 어제 학교에서 뭐 했어?"],["me","(대답하고 되묻기) 예: 체육 했어. 엄마는 뭐 했어?"],["dad","엄마는 회의했어. 요즘 쉬는 시간에 친구들이랑 무슨 얘기 해?"],["me","(대답 + 질문 하나) 예: 게임 얘기해. 엄마는 어릴 때 뭐 하고 놀았어?"]],
  tip:"현준이가 2~3문장 안에서 멈추고 되묻는지만 봐 주세요. 길어지면 손가락 세 개를 보여주는 신호를 정해두면 좋아요.",
  mission:["학교 친구 한 명과 대화해서 공통 관심사 1개 찾기","대화 중에 \"너는?\" 2번 써보기","찾은 관심사를 엄마한테 말해주기"]},
 {t:"문자·온라인 소통", sub:"메시지와 게임 채팅", goal:"메시지와 게임 채팅에서도 대화 규칙을 지켜요.",
  rules:["처음 보낼 땐 \"나 현준이야\"처럼 누군지 밝혀요.","답장이 없으면 최대 2번까지만 보내고 기다려요.","단톡방에 남을 놀리거나 사진을 함부로 올리지 않아요.","모르는 사람이 친구 추가하거나 개인정보를 물으면 거절하고 부모님께 말해요.","화날 때는 바로 보내지 말고 10분 뒤에 다시 읽어요."],
  key:"내일 놀이터에서 게임할래?",
  quiz:[
   {s:"친구한테 메시지를 보냈는데 30분째 답이 없어.",o:["\"??\" \"왜 답 안 해\" \"야\"를 계속 보낸다","조금 기다린다. 친구가 바쁠 수 있다","친구 엄마한테 연락한다","단톡방에 \"얘 나 무시함\"이라고 쓴다"],a:1,w:"답이 늦는 이유는 많아요. 연달아 보내면 친구가 부담스러워해요."},
   {s:"게임에서 모르는 사람이 \"너 몇 학년이야? 어디 살아?\"라고 물어.",o:["친절하게 다 알려준다","대답하지 않고 부모님께 보여준다","학교 이름만 알려준다","사진을 보내준다"],a:1,w:"모르는 사람에게 개인정보는 절대 알려주지 않아요."}],
  role:[["dad","(엄마가 친구 역할) 엄마 폰으로 현준이에게 메시지를 보낼게. 놀자고 답장해 볼래?"],["me","(메시지 쓰기) 예: 안녕 나 현준이야! 토요일에 놀이터에서 게임할래?"],["dad","(10분 동안 답장 안 하기)"],["me","(기다리기. 한 번만 더 보낸다면?) 예: 시간 되면 알려줘~"]],
  tip:"실제로 엄마 폰과 현준이 기기로 연습하면 효과가 커요. 답장을 일부러 늦게 해서 기다리는 연습을 시켜주세요.",
  mission:["친구에게 약속 잡는 메시지 1번 보내기","보내기 전에 엄마랑 문장 같이 확인하기","답이 늦어도 연달아 보내지 않기"]},
 {t:"친구 그룹 고르기", sub:"나랑 맞는 친구 찾기", goal:"나와 관심사가 맞고, 나를 잘 대해주는 친구를 알아봐요.",
  rules:["친구는 관심사가 비슷한 사람 중에서 찾아요. (야구, 게임, 피아노…)","좋은 친구 신호: 나를 반겨준다, 내 얘기를 들어준다, 같이 하자고 먼저 말한다.","조심할 신호: 나를 놀린다, 시키는 대로만 하게 한다, 다른 애들 앞에서 모른 척한다.","인기 많은 그룹이 꼭 나한테 맞는 그룹은 아니에요."],
  key:"나랑 관심사가 맞는 친구가 진짜 친구야.",
  quiz:[
   {s:"반에 아이돌 얘기만 하는 인기 그룹과, 야구 얘기하는 그룹이 있어. 나는 야구를 좋아해.",o:["인기 그룹에 계속 끼려고 한다","야구 얘기하는 그룹 쪽으로 간다","아무 데도 안 간다","인기 그룹에게 야구 얘기만 한다"],a:1,w:"관심사가 같으면 대화도 쉽고 친해지기도 쉬워요."},
   {s:"어떤 친구가 같이 놀 때마다 \"너는 이거 해, 저거 해\" 시키기만 하고 내 의견은 안 들어.",o:["좋은 친구니까 계속 시키는 대로 한다","조심해야 할 신호다. 다른 친구들과도 놀아본다","그 친구를 때린다","나도 똑같이 명령한다"],a:1,w:"좋은 친구는 서로 의견을 들어줘요. 한쪽만 시키는 건 조심할 신호예요."}],
  role:[["dad","현준이 반에서 어떤 친구들이 무슨 얘기를 자주 해?"],["me","(떠올려서 말하기) 예: ○○네는 게임 얘기, △△네는 축구 얘기 해."],["dad","그중에 현준이랑 제일 잘 맞을 것 같은 그룹은?"],["me","(이유까지 말하기) 예: 게임 그룹. 나도 그 게임 하니까."]],
  tip:"현준이가 꼽은 그룹을 만날 수 있는 자리(동아리, 방과후, 리틀야구)를 같이 찾아주세요.",
  mission:["반 친구들의 관심사 적어보기 (3명 이상)","나랑 맞을 것 같은 그룹 1곳 정하기","그 그룹 근처에서 대화 들어보기"]},
 {t:"대화에 끼기·빠지기", sub:"자연스럽게 들어가고 나오기", goal:"친구들 대화에 자연스럽게 들어가고, 안 받아주면 조용히 빠져요.",
  rules:["① 멀리서 듣는다 ② 쳐다본다 ③ 공통 관심사인지 확인한다","④ 가까이 간다 ⑤ 대화가 잠깐 멈출 때를 기다린다","⑥ 주제에 맞는 한 마디로 들어간다 ⑦ 반응을 확인한다","친구들이 안 쳐다보고 대답이 짧으면 받아주지 않는 신호예요. 조용히 다른 데로 가요.","안 받아주는 건 흔한 일이에요. 실패가 아니에요!"],
  key:"나도 어제 그거 했어!",
  quiz:[
   {s:"친구들이 게임 보스 얘기를 하고 있어. 나도 그 게임 해.",o:["갑자기 끼어들어 \"야! 나 어제 뭐 했는지 알아?\" 한다","잠깐 듣다가 대화가 멈출 때 \"나도 그 보스 깼어!\" 한다","멀리서 계속 쳐다보기만 한다","다른 주제로 바꾼다"],a:1,w:"듣고 → 멈출 때 → 주제에 맞는 한 마디. 이게 가장 자연스러워요."},
   {s:"대화에 들어갔는데 친구들이 나를 안 쳐다보고 등을 돌려.",o:["더 크게 말한다","\"왜 무시해!\" 하고 화낸다","조용히 다른 곳으로 간다","계속 서 있는다"],a:2,w:"받아주지 않는 신호예요. 화내지 말고 다른 그룹을 찾으면 돼요."}],

  <div class="card"><span class="tag">외워둘 한 마디</span><p class="say">“${esc(s.key)}”</p><p class="hint">소리 내서 세 번 말해 보세요.</p></div>
  <div class="row"><button class="btn" id="ok">${x.rule?"다 읽었어요 ★":"다 읽었어요"}</button></div>`;
  pn.querySelector("#ok").onclick=()=>{x.rule=true;save();tab="quiz";draw()};
}
function quizEnd(pn,s,x){
  const c=Object.values(x.quiz).filter(Boolean).length;
  pn.innerHTML=`<div class="card"><h3>${c===s.quiz.length?"퀴즈 통과! ★":"조금만 더!"}</h3>
  <p>${s.quiz.length}문제 중 ${c}문제를 첫 번째에 ${lv===2?"최고의 답으로 ":""}맞혔어요.</p>
  <div class="row"><button class="btn ghost" id="re">다시 풀기</button><button class="btn" id="nx">역할극으로</button></div></div>`;
  pn.querySelector("#re").onclick=()=>{x.quiz={};save();qi=0;draw()};
  pn.querySelector("#nx").onclick=()=>{tab="role";draw()};
}
function pQuiz(pn,s,x){
  if(qi>=s.quiz.length)return quizEnd(pn,s,x);
  const q=s.quiz[qi];
  pn.innerHTML=`<div class="card"><span class="tag">상황 ${qi+1} / ${s.quiz.length}</span><p class="sit">${esc(q.s)}</p>
  <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div><div id="fb"></div></div>`;
  let tried=false;
  pn.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,fb=pn.querySelector("#fb");
    if(k===q.a){
      b.classList.add("right");pn.querySelectorAll(".opt").forEach(o=>o.disabled=true);
      if(!(qi in x.quiz))x.quiz[qi]=!tried;save();
      fb.innerHTML=`<div class="why"><b>맞아요!</b> ${esc(q.w)}</div><div class="row" style="margin-top:12px"><button class="btn" id="nq">다음</button></div>`;
      fb.querySelector("#nq").onclick=()=>{qi++;draw()};
    }else{
      tried=true;b.classList.add("wrong");b.disabled=true;
      fb.innerHTML=`<div class="why no"><b>다시 생각해 볼까?</b> 이렇게 하면 친구나 상대가 어떤 기분일지 떠올려 보세요.</div>`;
    }
  });
}
function pQuiz2(pn,s,x){
  if(qi>=s.quiz.length)return quizEnd(pn,s,x);
  const q=s.quiz[qi];
  pn.innerHTML=`<div class="card"><span class="tag ${q.sub?"subtag":""}">${q.sub?"속뜻 읽기":"상황"} ${qi+1} / ${s.quiz.length}</span><p class="sit">${esc(q.s)}</p>
  ${q.sub?`<p class="hint">이 말이나 행동의 진짜 뜻은 뭘까?</p>`:`<p class="hint">괜찮은 답이 여러 개일 수 있어. 제일 좋은 답을 골라 봐.</p>`}
  <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div><div id="fb"></div></div>`;
  let tried=false;
  pn.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,fb=pn.querySelector("#fb");
    if(k===q.best){
      b.classList.add("right");pn.querySelectorAll(".opt").forEach(o=>o.disabled=true);
      if(!(qi in x.quiz))x.quiz[qi]=!tried;save();
      fb.innerHTML=`<div class="why"><b>최고의 답!</b> ${esc(q.w)}</div>
      ${q.ask?`<div class="ask"><b>엄마한테 말해 보기</b> ${esc(q.ask)}</div>`:""}
      <div class="row" style="margin-top:12px"><button class="btn" id="nq">${q.ask?"이유 말했어요, 다음":"다음"}</button></div>`;
      fb.querySelector("#nq").onclick=()=>{qi++;draw()};
    }else if(q.ok.includes(k)){
      tried=true;b.classList.add("meh");b.disabled=true;
      fb.innerHTML=`<div class="why meh"><b>나쁘지 않아.</b> 그런데 관계를 더 잘 지키는 답이 있어. 한 번 더 골라 봐.</div>`;
    }else{
      tried=true;b.classList.add("wrong");b.disabled=true;
      fb.innerHTML=`<div class="why no"><b>다시 생각해 보자.</b> 이렇게 하면 상대는 어떤 기분일까? 일이 더 커질까?</div>`;
    }
  });
}
function pRole(pn,s,x){
  pn.innerHTML=`<div class="card"><h3>엄마랑 역할극</h3><p class="hint">엄마가 노란 칸 대사를 읽고, 현준이는 괄호 안 미션대로 자기 말로 해 보세요. 예시는 참고만!</p>
  ${s.role.map(([w,t])=>`<div class="line"><span class="who ${w}">${w==="dad"?"엄마":"현준"}</span><p class="txt">${esc(t)}</p></div>`).join("")}</div>
  <div class="parent"><b>엄마 코칭 팁</b> ${esc(s.tip)}</div>
  <div class="row"><button class="btn" id="ok">${x.role?"역할극 완료 ★":"역할극 다 했어요"}</button></div>`;
  pn.querySelector("#ok").onclick=()=>{x.role=true;save();tab="mission";draw()};
}
function pMission(pn,s,x){
  pn.innerHTML=`<div class="card"><h3>이번 주 미션</h3><p class="hint">학교나 집에서 진짜로 해 보고, 한 것을 체크해요.</p>
  ${s.mission.map((m,k)=>`<div class="check"><input type="checkbox" id="m${lv}-${cur}-${k}" ${x.mission[k]?"checked":""} data-k="${k}"><label for="m${lv}-${cur}-${k}">${esc(m)}</label></div>`).join("")}</div>
  <div class="parent"><b>주말에 물어보기</b> “이번 주 미션 해봤어? 어땠어?” 결과보다 해본 것 자체를 칭찬해 주세요.</div>
  <div class="row">${lv===1&&stars(cur,1)===4?`<button class="btn" id="up">이 회기 2단계 하기</button>`:""}${cur<D().length-1?`<button class="btn ${lv===1&&stars(cur,1)===4?"ghost":""}" id="nx">다음 회기로</button>`:""}<button class="btn ghost" id="hm">전체 회기</button></div>`;
  pn.querySelectorAll("input").forEach(c=>c.onchange=()=>{x.mission[+c.dataset.k]=c.checked;save();draw()});
  const nx=pn.querySelector("#nx");if(nx)nx.onclick=()=>{if(lv===2&&!unlocked(cur+1)){home();return}open(cur+1)};
  const up=pn.querySelector("#up");if(up)up.onclick=()=>{const i=cur;lv=2;try{localStorage.setItem(KEY+"-lv",2)}catch(e){}open(i)};
  pn.querySelector("#hm").onclick=home;
}
home();
</script>

<p class="xlink"><a href="../">← 현준이 맞춤 말하기 연습으로</a></p>
<div class="install" id="install" hidden><p><b>앱처럼 쓰기</b> 홈 화면에 추가하면 바로 열 수 있어요.</p><button class="btn" id="installBtn">추가</button></div>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("../sw.js").catch(()=>{})})}
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;const box=document.getElementById("install");if(box){box.hidden=false;
  document.getElementById("installBtn").onclick=async()=>{box.hidden=true;try{deferredPrompt.prompt();await deferredPrompt.userChoice}catch(x){}deferredPrompt=null}}});
window.addEventListener("appinstalled",()=>{const b=document.getElementById("install");if(b)b.hidden=true});
</script>
